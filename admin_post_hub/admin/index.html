    <style>
        /* Clean UI Polish: Ensure original sidebar and layout breathe naturally */
        body {
            margin: 0;
            background-color: #f4f6f8 !important;
            font-family: 'Public Sans', sans-serif !important;
        }
        /* Top app bar shadow and clean styling */
        header.MuiAppBar-root {
            background-color: rgba(255, 255, 255, 0.92) !important;
            backdrop-filter: blur(8px);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05) !important;
            border-bottom: 1px solid #e5e7eb;
            color: #212b36 !important;
        }
        /* Proper card elevation and clean borders for tables */
        .MuiPaper-root {
            box-shadow: 0 0 2px 0 rgba(145, 158, 171, 0.2), 0 12px 24px -4px rgba(145, 158, 171, 0.12) !important;
            border-radius: 12px !important;
        }
        /* App Screens Studio Button in Top Bar */
        .app-screens-nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #00ab55 0%, #007b55 100%);
            color: #ffffff !important;
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 171, 85, 0.3);
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .app-screens-nav-pill:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0, 171, 85, 0.4);
        }
    </style>
    <script>
        // Clear any old collapse flags so full sidebar always renders
        localStorage.removeItem('sidebar_collapsed');
        document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.remove('sidebar-collapsed');
