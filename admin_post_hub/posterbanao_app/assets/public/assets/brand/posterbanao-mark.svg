  <text x="80" y="100" text-anchor="middle" font-family="Outfit, Poppins, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-2" fill="#fff">PB</text>
  <circle cx="43" cy="45" r="6" fill="#fff" opacity="0.86"/>
  <circle cx="56" cy="31" r="4" fill="#ffd34d" opacity="0.95"/>
  <circle cx="118" cy="40" r="4" fill="#fff" opacity="0.78"/>
  <circle cx="126" cy="112" r="5" fill="#ffd34d" opacity="0.92"/>
  <circle cx="36" cy="118" r="4" fill="#fff" opacity="0.72"/>
