<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">PosterBanao mark</title>
  <desc id="desc">A gradient invite card with PB initials and rangoli dots.</desc>
  <defs>
    <linearGradient id="tile" x1="20" y1="18" x2="142" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b2c"/>
      <stop offset="0.48" stop-color="#e91e8c"/>
      <stop offset="1" stop-color="#00bfa6"/>
    </linearGradient>
    <linearGradient id="shine" x1="34" y1="25" x2="128" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
